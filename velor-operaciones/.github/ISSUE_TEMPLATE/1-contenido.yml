name: Contenido
description: Videotutorial o publicación en redes
title: "[Contenido] "
type: Contenido
projects: ["velor-innovation/5"]
body:
  - type: dropdown
    id: formato
    attributes:
      label: Formato
      options:
        - Videotutorial
        - Publicación en redes
        - Otro
    validations:
      required: true
  - type: input
    id: issue
    attributes:
      label: Issue de desarrollo relacionado (si aplica)
      placeholder: velor-innovation/siat#123
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué se va a crear y para quién?
    validations:
      required: true
  - type: input
    id: drive
    attributes:
      label: Link al archivo final en Google Drive
      description: Se llena al terminar.
