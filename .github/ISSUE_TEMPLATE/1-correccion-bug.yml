name: Corrección bug
description: Algo del sistema no funciona como debería
title: "[Bug] "
type: Corrección bug
projects: ["velor-innovation/5"]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué está fallando?
      description: Describe el error y en qué pantalla o módulo ocurre.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar a ...
        2. Dar clic en ...
        3. Aparece ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué debería pasar?
    validations:
      required: true
  - type: input
    id: cliente
    attributes:
      label: Cliente que lo reportó (si aplica)
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, mensajes de error o registros. Puedes arrastrar imágenes aquí.
